spring.application.name=exam-access-control

# Set DB_URL, DB_USERNAME, and DB_PASSWORD in the process environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/exam_access_control}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Keep SQL and bound values out of routine application logs.
# Temporary default for the existing, not-yet-reconciled schema. Set DDL_AUTO=validate
# after running SCHEMA_VERIFICATION.sql and confirming the mappings match PostgreSQL.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
